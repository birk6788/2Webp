name: Bug
description: Signaler un dysfonctionnement reproductible
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version 2Webp
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows et mise à l'échelle
      placeholder: Windows 11, 125 %
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true
