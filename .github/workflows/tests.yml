name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check version
        run: python scripts/check_version.py
      - name: Compile Python
        run: python -m py_compile app.py core.py
      - name: Run tests
        shell: powershell
        run: |
          $tests = @(
            "test_translations.py",
            "test_presets.py",
            "test_preset_ui.py",
            "test_business_groups.py",
            "test_conversion.py",
            "test_conversion_ui.py",
            "test_settings_ui.py",
            "smoke_test.py",
            "test_clean_branding.py",
            "test_windows_icon.py"
          )
          foreach ($test in $tests) {
            python ".\tests\$test"
          }
