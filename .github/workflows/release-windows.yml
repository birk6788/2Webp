name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build all Windows artifacts
        shell: pwsh
        run: |
          & .\scripts\build-release.ps1 *>&1 | Tee-Object -FilePath .\windows-release.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Attach failure summary
        if: failure()
        shell: pwsh
        run: |
          "## Windows release failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path .\windows-release.log) {
            "```text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content .\windows-release.log -Tail 200 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "No build log was produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2Webp-Windows-diagnostics-${{ github.run_id }}
          path: windows-release.log
          if-no-files-found: warn

      - name: Upload workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 2Webp-Windows-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem .\release |
            Where-Object { $_.Name -match '\.(exe|zip|txt)$' } |
            Select-Object -ExpandProperty FullName
          & gh release create "${{ github.ref_name }}" @assets `
            --title "2Webp ${{ github.ref_name }}" `
            --notes-file .\RELEASE_NOTES.md
